---
- name: Validate export filename prefix
  ansible.builtin.assert:
    that:
      - routeros_export_filename_prefix is string
      - routeros_export_filename_prefix | length > 0
      - routeros_export_filename_prefix is not search('[^A-Za-z0-9_-]')
    fail_msg: routeros_export_filename_prefix must contain only letters, numbers, underscores, or hyphens.

- name: Create RouterOS plain-text configuration export
  register: routeros_export_result
  changed_when: true
  community.routeros.command:
    commands:
      - "/export file={{ routeros_export_filename_prefix }}-{{ now(utc=true, fmt='%Y%m%d-%H%M') }}"
...
