---
- name: Validate VPN resources
  ansible.builtin.assert:
    that:
      - routeros_vpn_ipsec_peers is sequence
    fail_msg: IPsec peers must be supplied as a list of mappings.

- name: Manage RouterOS IPsec peers
  loop: "{{ routeros_vpn_ipsec_peers }}"
  loop_control:
    label: "{{ item.address }}"
  no_log: true
  changed_when: true
  when: routeros_vpn_ipsec_peers | length > 0
  community.routeros.command:
    commands:
      - >-
        /ip ipsec peer add address={{ item.address }}{% for option in item.options | default({}) | dict2items %} {{ option.key }}={{ option.value }}{% endfor %}
...
