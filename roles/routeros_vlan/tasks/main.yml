---
- name: Validate VLAN resources
  ansible.builtin.assert:
    that:
      - routeros_vlan_bridges is sequence
      - routeros_vlan_interfaces is sequence
      - routeros_vlan_vlans is sequence
    fail_msg: VLAN resources must be supplied as lists of mappings.
- name: Manage RouterOS bridges
  loop: "{{ routeros_vlan_bridges }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: true
  when: routeros_vlan_bridges | length > 0
  community.routeros.command:
    commands:
      - >-
        /interface bridge add name={{ item.name }}{% for option in item.options | default({}) | dict2items %} {{ option.key }}={{ option.value }}{% endfor %}
- name: Manage RouterOS VLAN interfaces
  loop: "{{ routeros_vlan_vlans }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: true
  when: routeros_vlan_vlans | length > 0
  community.routeros.command:
    commands:
      - >-
        /interface vlan add name={{ item.name }} vlan-id={{ item.vlan_id }} interface={{ item.interface }}
- name: Assign RouterOS bridge ports
  loop: "{{ routeros_vlan_interfaces }}"
  loop_control:
    label: "{{ item.bridge }} {{ item.interface }}"
  changed_when: true
  when: routeros_vlan_interfaces | length > 0
  community.routeros.command:
    commands:
      - "/interface bridge port add bridge={{ item.bridge }} interface={{ item.interface }}"
...
