---
- name: Validate monitoring resources
  ansible.builtin.assert:
    that:
      - routeros_monitoring_syslog_actions is sequence
      - routeros_monitoring_snmp is mapping
      - routeros_monitoring_netwatch is sequence
    fail_msg: Monitoring resources must use the documented mappings and lists.
- name: Manage RouterOS syslog actions
  loop: "{{ routeros_monitoring_syslog_actions }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: true
  when: routeros_monitoring_syslog_actions | length > 0
  community.routeros.command:
    commands:
      - >-
        /system logging action add name={{ item.name }} target={{ item.target }}{% for option in item.options | default({}) | dict2items %} {{ option.key }}={{ option.value }}{% endfor %}
- name: Configure RouterOS SNMP
  no_log: true
  changed_when: true
  when: routeros_monitoring_snmp | length > 0
  community.routeros.command:
    commands:
      - >-
        /snmp set{% for option in routeros_monitoring_snmp | dict2items %} {{ option.key }}={{ option.value }}{% endfor %}
- name: Manage RouterOS Netwatch entries
  loop: "{{ routeros_monitoring_netwatch }}"
  loop_control:
    label: "{{ item.host }}"
  changed_when: true
  when: routeros_monitoring_netwatch | length > 0
  community.routeros.command:
    commands:
      - >-
        /tool netwatch add host={{ item.host }}{% for option in item.options | default({}) | dict2items %} {{ option.key }}={{ option.value }}{% endfor %}
...
